name: Build macOS app

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15          # Apple Silicon
            arch: apple-silicon
          - runner: macos-15-intel    # Intel
            arch: intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Mac tests (throwaway font: scan, Trash, History, restore)
        run: python tests/test_mac.py

      - name: Build, smoke-test and package
        run: python build_mac.py
        env:
          GH_TOKEN: ${{ github.token }}

      - uses: actions/upload-artifact@v5
        with:
          name: dl_font_fixer-mac-${{ matrix.arch }}
          path: dist/MacOS/*.dmg
          if-no-files-found: error
          retention-days: 30
